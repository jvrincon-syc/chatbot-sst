[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-sst"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.0,<2.11",
  "pypdf>=4,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.setuptools]
package-dir = {"" = "app/back/src"}

[tool.setuptools.packages.find]
where = ["app/back/src"]

[tool.pytest.ini_options]
pythonpath = ["app/back/src"]
testpaths = ["app/back/tests"]
